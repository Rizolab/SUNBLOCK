<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUNBLOCK · Entrenamiento de Escalada</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1e232d;
      --border: #2a303d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #e06d44;
      --accent-hover: #c95830;
      --accent-soft: rgba(224, 109, 68, 0.14);
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 56px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .brand-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .sync-text {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, button, input, textarea {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
    }

    select, button {
      padding: 9px 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: #475569;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.ghost {
      background: transparent;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Barra de semanas y días */
    .week-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Banner del bloque y regla del día */
    .session-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
    }

    .phase-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .session-banner h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .session-meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 10px;
    }

    .rule-box {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #e2e8f0;
    }

    /* Temporizador tipo Lattice */
    .timer-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .timer-display {
      font-size: 2.3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: var(--text);
      text-align: center;
      padding: 4px 0;
    }

    .timer-display.running {
      color: var(--accent);
    }

    .timer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .timer-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-btn {
      padding: 5px 9px;
      font-size: 0.75rem;
      border-radius: 8px;
      background: var(--surface);
    }

    /* Secciones y tarjetas de ejercicios */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .ex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .ex-media {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      min-height: 155px;
    }

    .ex-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ex-media .placeholder {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .zoom-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 17, 21, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .ex-content {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .ex-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .ex-title {
      margin: 0;
      font-size: 1.08rem;
    }

    .ex-focus {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .ex-goal {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .prescription-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .rx-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 0.84rem;
    }

    .rx-pill strong {
      color: var(--accent);
    }

    .ex-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .steps-drawer {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .steps-drawer.open {
      display: block;
    }

    .steps-drawer ol {
      margin: 6px 0 8px 18px;
      padding: 0;
    }

    .steps-drawer li {
      margin-bottom: 4px;
    }

    .safe-alt {
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* Bitácora */
    .log-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .log-card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    .log-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input, .field textarea {
      padding: 10px 12px;
    }

    .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .traffic-group {
      display: flex;
      gap: 6px;
    }

    .traffic-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      text-transform: capitalize;
    }

    .traffic-btn.active-verde {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--green);
      color: #86efac;
    }

    .traffic-btn.active-amarillo {
      background: rgba(234, 179, 8, 0.2);
      border-color: var(--yellow);
      color: #fde047;
    }

    .traffic-btn.active-rojo {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: #fca5a5;
    }

    /* Lightbox */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 780px;
      width: 100%;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .modal-img-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .modal-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.86rem;
      display: none;
      z-index: 80;
    }

    @media (max-width: 820px) {
      .session-banner { grid-template-columns: 1fr; }
      .ex-card { grid-template-columns: 1fr; }
      .ex-media { border-right: 0; border-bottom: 1px solid var(--border); max-height: 210px; }
      .log-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <span class="brand-title">SUNBLOCK</span>
      <span class="brand-tag">ESCALADA & FUERZA</span>
      <span class="sync-text" id="syncStatus">Conectando...</span>
    </div>
    <div class="header-controls">
      <select id="blockSelect" onchange="onBlockChange()"></select>
      <select id="weekSelect" onchange="onWeekChange()"></select>
      <a href="./admin.html" style="text-decoration:none;"><button type="button" class="ghost">Admin</button></a>
      <button type="button" onclick="loadAllData()">↻</button>
    </div>
  </header>

  <main class="container">
    <!-- Selector de días del microciclo -->
    <section class="week-row">
      <div class="pills" id="dayPills"></div>
      <div class="sync-text" id="phaseSummary"></div>
    </section>

    <!-- Cabecera del día + Temporizador -->
    <section class="session-banner">
      <div>
        <span class="phase-badge" id="dayTag">SESIÓN</span>
        <h1 id="dayTitle">Cargando sesión...</h1>
        <div class="session-meta" id="dayMeta"></div>
        <div class="rule-box" id="dayRule"></div>
      </div>

      <div class="timer-card">
        <div class="timer-top">
          <span id="timerLabel">CRONÓMETRO · TRABAJO / DESCANSO</span>
          <span id="timerStatus">LISTO</span>
        </div>
        <div class="timer-display" id="timerDisplay">01:30</div>
        <div class="timer-actions">
          <button type="button" class="primary" id="startPauseBtn" onclick="toggleTimer()">Iniciar</button>
          <button type="button" onclick="resetTimer()">Reiniciar</button>
          <button type="button" onclick="loadCurrentDayRest()">Descanso día</button>
        </div>
        <div class="timer-presets">
          <button type="button" class="preset-btn" onclick="setTimerSeconds(10)">10s</button>
          <button type="button" class="preset-btn" onclick="setTimerSeconds(20)">20s</button>
          <button type="button" class="preset-btn" onclick="setTimerSeconds(60)">60s</button>
          <button type="button" class="preset-btn" onclick="setTimerSeconds(90)">90s</button>
          <button type="button" class="preset-btn" onclick="setTimerSeconds(150)">2.5m</button>
          <button type="button" class="preset-btn" onclick="setTimerSeconds(180)">3m</button>
        </div>
      </div>
    </section>

    <!-- Ejercicios del día agrupados por sección -->
    <div id="sectionsContainer"></div>

    <!-- Bitácora de sesión (4_BITACORA) -->
    <section class="log-card">
      <h2>Bitácora de Sesión</h2>
      <form id="logForm" onsubmit="submitLog(event)">
        <div class="log-grid">
          <div class="field">
            <label for="logRpe">RPE percibido (1 - 10)</label>
            <input type="number" id="logRpe" min="1" max="10" step="0.5" value="6" required />
          </div>

          <div class="field">
            <label>Estado dedos / poleas</label>
            <div class="traffic-group" data-target="logDedos">
              <button type="button" class="traffic-btn active-verde" data-val="verde" onclick="pickTraffic('logDedos', 'verde', this)">Verde</button>
              <button type="button" class="traffic-btn" data-val="amarillo" onclick="pickTraffic('logDedos', 'amarillo', this)">Amarillo</button>
              <button type="button" class="traffic-btn" data-val="rojo" onclick="pickTraffic('logDedos', 'rojo', this)">Rojo</button>
            </div>
            <input type="hidden" id="logDedos" value="verde" />
          </div>

          <div class="field">
            <label>Estado codos / hombros</label>
            <div class="traffic-group" data-target="logCodos">
              <button type="button" class="traffic-btn active-verde" data-val="verde" onclick="pickTraffic('logCodos', 'verde', this)">Verde</button>
              <button type="button" class="traffic-btn" data-val="amarillo" onclick="pickTraffic('logCodos', 'amarillo', this)">Amarillo</button>
              <button type="button" class="traffic-btn" data-val="rojo" onclick="pickTraffic('logCodos', 'rojo', this)">Rojo</button>
            </div>
            <input type="hidden" id="logCodos" value="verde" />
          </div>
        </div>

        <div class="field" style="margin-bottom:14px;">
          <label for="logNote">Notas de ejecución, sensaciones o bloque</label>
          <textarea id="logNote" placeholder="Cómo sentiste la técnica, descansos, fuerza de dedos o escalada en muro..."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="primary" id="saveLogBtn">Guardar en Bitácora</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Modal ampliado de imagen y guía biomecánica -->
  <div class="modal-backdrop" id="detailModal" onclick="if(event.target===this) closeDetailModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Ejercicio</h3>
        <button type="button" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-img-wrap" id="modalImgWrap"></div>
      <p id="modalGoal" style="margin:0 0 10px; color:var(--muted); font-size:0.9rem;"></p>
      <div id="modalSteps" style="font-size:0.88rem; line-height:1.55;"></div>
      <div id="modalSafeAlt" class="safe-alt" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbyZNbEWVu5_YoxPGNeeEJppnAo3WOuPtAy0nHZdVuZOV9iY-d5G1OjTaB0MVwIlA9iV0g/exec";

    let db = {
      mesocycles: [],
      encyclopedia: [],
      microcycles: []
    };

    let currentBlockId = "";
    let currentWeek = 1;
    let currentDayCode = "";

    // Estado del cronómetro
    let remainingSec = 90;
    let timerInterval = null;
    let isRunning = false;

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function normalizeAssetUrl(url) {
      const clean = (url || "").trim();
      if (!clean) return "";
      if (/^https?:\/\//i.test(clean) || clean.startsWith("./") || clean.startsWith("/")) {
        return clean;
      }
      return "./" + clean;
    }

    function parseRestToSeconds(restStr) {
      if (!restStr) return 0;
      const s = String(restStr).toLowerCase().trim();
      const minMatch = s.match(/([\d.]+)\s*min/);
      if (minMatch) return Math.round(parseFloat(minMatch[1]) * 60);
      const secMatch = s.match(/(\d+)\s*seg/);
      if (secMatch) return parseInt(secMatch[1], 10);
      return 0;
    }

    function formatTime(sec) {
      const clamped = Math.max(0, Math.floor(sec));
      const m = String(Math.floor(clamped / 60)).padStart(2, "0");
      const r = String(clamped % 60).padStart(2, "0");
      return `${m}:${r}`;
    }

    function updateTimerUI() {
      const disp = document.getElementById("timerDisplay");
      disp.textContent = formatTime(remainingSec);
      disp.classList.toggle("running", isRunning);
      document.getElementById("startPauseBtn").textContent = isRunning ? "Pausar" : "Iniciar";
      document.getElementById("timerStatus").textContent = isRunning ? "ACTIVO" : "PAUSADO / LISTO";
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (_) {}
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
        updateTimerUI();
        return;
      }
      if (remainingSec <= 0) remainingSec = 60;
      isRunning = true;
      updateTimerUI();
      timerInterval = setInterval(() => {
        remainingSec -= 1;
        if (remainingSec <= 0) {
          remainingSec = 0;
          clearInterval(timerInterval);
          timerInterval = null;
          isRunning = false;
          playBeep();
          showToast("Tiempo completado");
        }
        updateTimerUI();
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      updateTimerUI();
    }

    function setTimerSeconds(sec, label = "CRONÓMETRO · MANUAL") {
      resetTimer();
      remainingSec = Math.max(1, Number(sec) || 60);
      document.getElementById("timerLabel").textContent = label;
      updateTimerUI();
    }

    function loadCurrentDayRest() {
      const rows = db.microcycles.filter(r => r.block_id === currentBlockId && r.day_code === currentDayCode);
      const firstRest = rows.map(r => parseRestToSeconds(r.rest)).find(sec => sec > 0);
      if (firstRest) {
        setTimerSeconds(firstRest, `DESCANSO · ${firstRest}S`);
      } else {
        showToast("Este día no tiene descanso temporizado definido.");
      }
    }

    async function loadAllData() {
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "Sincronizando...";
      try {
        const res = await fetch(EXEC_URL + "?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        db.mesocycles = Array.isArray(data.mesocycles) ? data.mesocycles : [];
        db.encyclopedia = Array.isArray(data.encyclopedia) ? data.encyclopedia : [];
        db.microcycles = Array.isArray(data.microcycles) ? data.microcycles : [];

        statusEl.textContent = `SUNBLOCK_DB · ${db.encyclopedia.length} ejercicios`;
        populateBlockSelect();
        onBlockChange(true);
      } catch (err) {
        statusEl.textContent = "Sin conexión a la hoja";
        showToast("No se pudieron cargar los datos de SUNBLOCK_DB.");
      }
    }

    function populateBlockSelect() {
      const sel = document.getElementById("blockSelect");
      const prev = currentBlockId || sel.value;
      sel.innerHTML = "";
      db.mesocycles.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.block_id;
        opt.textContent = m.title;
        sel.appendChild(opt);
      });
      currentBlockId = db.mesocycles.some(m => m.block_id === prev)
        ? prev
        : (db.mesocycles[0]?.block_id || "");
      sel.value = currentBlockId;
    }

    function onBlockChange(keepDay = false) {
      currentBlockId = document.getElementById("blockSelect").value;
      const meso = db.mesocycles.find(m => m.block_id === currentBlockId);
      const totalWeeks = Number(meso?.weeks) || 4;

      const weekSel = document.getElementById("weekSelect");
      weekSel.innerHTML = "";
      for (let w = 1; w <= totalWeeks; w++) {
        const opt = document.createElement("option");
        opt.value = String(w);
        opt.textContent = `Semana ${w} de ${totalWeeks}`;
        weekSel.appendChild(opt);
      }
      currentWeek = Math.min(currentWeek || 1, totalWeeks);
      weekSel.value = String(currentWeek);

      updatePhaseSummary(meso);
      renderDayPills(keepDay);
    }

    function onWeekChange() {
      currentWeek = Number(document.getElementById("weekSelect").value) || 1;
      const meso = db.mesocycles.find(m => m.block_id === currentBlockId);
      updatePhaseSummary(meso);
      renderSession();
    }

    function updatePhaseSummary(meso) {
      const summaryEl = document.getElementById("phaseSummary");
      if (!meso || !meso.phases_json) {
        summaryEl.textContent = "";
        return;
      }
      try {
        const phases = typeof meso.phases_json === "string"
          ? JSON.parse(meso.phases_json)
          : meso.phases_json;
        const activePhase = Array.isArray(phases)
          ? phases.find(p => Array.isArray(p.weeks) && p.weeks.includes(currentWeek))
          : null;
        summaryEl.textContent = activePhase ? activePhase.name : "";
      } catch (_) {
        summaryEl.textContent = "";
      }
    }

    function renderDayPills(keepDay = false) {
      const rows = db.microcycles.filter(r => r.block_id === currentBlockId);
      const uniqueDays = [];
      const seen = new Set();
      rows.forEach(r => {
        if (!seen.has(r.day_code)) {
          seen.add(r.day_code);
          uniqueDays.push({
            code: r.day_code,
            short: r.day_short || r.day_code,
            title: r.day_title || r.day_code
          });
        }
      });

      if (!keepDay || !uniqueDays.some(d => d.code === currentDayCode)) {
        currentDayCode = uniqueDays[0]?.code || "";
      }

      const container = document.getElementById("dayPills");
      container.innerHTML = "";
      uniqueDays.forEach(d => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pill" + (d.code === currentDayCode ? " active" : "");
        btn.textContent = `${d.code} · ${d.short}`;
        btn.onclick = () => {
          currentDayCode = d.code;
          renderDayPills(true);
          renderSession();
        };
        container.appendChild(btn);
      });

      renderSession();
    }

    function getPrescriptionByWeek(row) {
      if (currentWeek >= 3 && row.p2) return { label: "Progresión (P2)", value: row.p2 };
      if (currentWeek === 2 && row.p2) return { label: "Base / P2", value: row.p2 };
      return { label: "Prescripción (RX)", value: row.rx || "Según sesión" };
    }

    function renderSession() {
      const dayRows = db.microcycles.filter(
        r => r.block_id === currentBlockId && r.day_code === currentDayCode
      );
      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      if (!dayRows.length) {
        document.getElementById("dayTitle").textContent = "Día sin ejercicios programados";
        document.getElementById("dayMeta").textContent = "";
        document.getElementById("dayRule").textContent = "";
        return;
      }

      const head = dayRows[0];
      document.getElementById("dayTag").textContent = head.day_tag || head.day_short || "SESIÓN";
      document.getElementById("dayTitle").textContent = head.day_title || head.day_code;
      document.getElementById("dayMeta").textContent =
        `${head.day_code} · Duración estimada: ${head.duration || "—"} · Semana ${currentWeek}`;
      document.getElementById("dayRule").textContent = head.rule || "Mantén técnica limpia y control articular.";

      const validExercises = dayRows.filter(r => r.ex_id && String(r.ex_id).trim() !== "");
      if (!validExercises.length) {
        container.innerHTML = `<div class="session-banner"><p style="margin:0; color:var(--muted);">Día de recuperación o descanso sin ejercicios cargados.</p></div>`;
        return;
      }

      const grouped = [];
      const map = new Map();
      validExercises.forEach(r => {
        const secName = r.section || "Ejercicios de la sesión";
        if (!map.has(secName)) {
          map.set(secName, []);
          grouped.push({ section: secName, items: map.get(secName) });
        }
        map.get(secName).push(r);
      });

      grouped.forEach(grp => {
        const secEl = document.createElement("section");
        secEl.className = "section-block";
        secEl.innerHTML = `<div class="section-heading">${grp.section}</div>`;

        grp.items.forEach((row, idx) => {
          const ex = db.encyclopedia.find(e => e.id === row.ex_id) || {
            id: row.ex_id,
            name: row.ex_id,
            focus: "Catálogo",
            goal: "Ejercicio programado en el microciclo.",
            steps: "",
            safeAlt: "",
            media_url: ""
          };

          const imgSrc = normalizeAssetUrl(ex.media_url);
          const pres = getPrescriptionByWeek(row);
          const restSec = parseRestToSeconds(row.rest);
          const holdSec = Number(ex.hold_sec) || 0;
          const drawerId = `drawer-${currentDayCode}-${row.ex_id}-${idx}`;

          const stepsArr = Array.isArray(ex.steps)
            ? ex.steps
            : String(ex.steps || "").split("|").map(s => s.trim()).filter(Boolean);

          const card = document.createElement("article");
          card.className = "ex-card";
          card.innerHTML = `
            <div class="ex-media" onclick="openDetail('${ex.id}')">
              ${
                imgSrc
                  ? `<img src="${imgSrc}" alt="${ex.name}" loading="lazy" onerror="this.outerHTML='<div class=placeholder>Imagen no encontrada:<br><code>${imgSrc}</code></div>'" /><span class="zoom-badge">Ampliar</span>`
                  : `<div class="placeholder">Sin imagen vinculada<br><small>${ex.id}</small></div>`
              }
            </div>
            <div class="ex-content">
              <div>
                <div class="ex-header">
                  <div>
                    <h3 class="ex-title">${ex.name}</h3>
                    <p class="ex-goal">${ex.goal || ""}</p>
                  </div>
                  <span class="ex-focus">${ex.focus || "General"}</span>
                </div>

                <div class="prescription-strip" style="margin-top:10px;">
                  <div class="rx-pill">${pres.label}: <strong>${pres.value}</strong></div>
                  <div class="rx-pill">Descanso: <strong>${row.rest || "—"}</strong></div>
                  ${holdSec > 0 ? `<div class="rx-pill">Hold: <strong>${holdSec}s</strong></div>` : ""}
                </div>
              </div>

              <div>
                <div class="ex-actions">
                  ${holdSec > 0 ? `<button type="button" onclick="setTimerSeconds(${holdSec}, 'HOLD · ${ex.name.slice(0, 18)}')">⏱ Hold ${holdSec}s</button>` : ""}
                  ${restSec > 0 ? `<button type="button" onclick="setTimerSeconds(${restSec}, 'DESCANSO · ${ex.name.slice(0, 18)}')">⏱ Descanso (${row.rest})</button>` : ""}
                  <button type="button" onclick="toggleDrawer('${drawerId}')">Guía y técnica</button>
                </div>

                <div class="steps-drawer" id="${drawerId}">
                  <strong>Ejecución técnica</strong>
                  ${
                    stepsArr.length
                      ? `<ol>${stepsArr.map(st => `<li>${st}</li>`).join("")}</ol>`
                      : `<p style="margin:6px 0; color:var(--muted);">Sin pasos detallados registrados aún.</p>`
                  }
                  ${ex.safeAlt ? `<div class="safe-alt"><strong>Alternativa segura:</strong> ${ex.safeAlt}</div>` : ""}
                </div>
              </div>
            </div>
          `;
          secEl.appendChild(card);
        });

        container.appendChild(secEl);
      });
    }

    function toggleDrawer(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle("open");
    }

    function openDetail(exId) {
      const ex = db.encyclopedia.find(e => e.id === exId);
      if (!ex) return;
      document.getElementById("modalTitle").textContent = `${ex.name} · ${ex.focus || ""}`;
      document.getElementById("modalGoal").textContent = ex.goal || "";

      const imgSrc = normalizeAssetUrl(ex.media_url);
      const wrap = document.getElementById("modalImgWrap");
      wrap.innerHTML = imgSrc
        ? `<img src="${imgSrc}" alt="${ex.name}" />`
        : `<span style="color:var(--muted); font-size:0.86rem;">Sin imagen asignada para ${ex.id}</span>`;

      const stepsArr = Array.isArray(ex.steps)
        ? ex.steps
        : String(ex.steps || "").split("|").map(s => s.trim()).filter(Boolean);

      document.getElementById("modalSteps").innerHTML = stepsArr.length
        ? `<strong>Pasos de ejecución</strong><ol style="margin:6px 0 0 18px; padding:0;">${stepsArr.map(s => `<li style="margin-bottom:5px;">${s}</li>`).join("")}</ol>`
        : "";

      const altEl = document.getElementById("modalSafeAlt");
      altEl.innerHTML = ex.safeAlt ? `<strong>Alternativa segura:</strong> ${ex.safeAlt}` : "";

      document.getElementById("detailModal").classList.add("open");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function pickTraffic(inputId, val, btnEl) {
      document.getElementById(inputId).value = val;
      const group = btnEl.parentElement;
      group.querySelectorAll(".traffic-btn").forEach(b => {
        b.classList.remove("active-verde", "active-amarillo", "active-rojo");
      });
      btnEl.classList.add(`active-${val}`);
    }

    async function submitLog(e) {
      e.preventDefault();
      const btn = document.getElementById("saveLogBtn");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      const meso = db.mesocycles.find(m => m.block_id === currentBlockId);
      const dayRows = db.microcycles.filter(
        r => r.block_id === currentBlockId && r.day_code === currentDayCode
      );
      const head = dayRows[0] || {};

      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);

      const payload = {
        action: "SAVE_LOG",
        data: {
          timestamp: now.toISOString(),
          date: dateStr,
          block_id: currentBlockId,
          meso_title: meso?.title || currentBlockId,
          week: currentWeek,
          day_code: currentDayCode,
          day_title: head.day_title || currentDayCode,
          rpe: Number(document.getElementById("logRpe").value) || 6,
          dedos: document.getElementById("logDedos").value,
          codos: document.getElementById("logCodos").value,
          note: document.getElementById("logNote").value.trim()
        }
      };

      try {
        await fetch(EXEC_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        document.getElementById("logNote").value = "";
        showToast("Sesión registrada en 4_BITACORA");
      } catch (_) {
        showToast("Error al enviar el registro.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar en Bitácora";
      }
    }

    updateTimerUI();
    loadAllData();
  </script>
</body>
</html>
